# MongoDB Config Server Configuration (Master Node)
# Stores metadata and routing information for the sharded cluster

systemLog:
  destination: file
  path: /var/log/mongodb/configsvr.log
  logAppend: true

storage:
  dbPath: /data/configdb

net:
  port: 27019
  bindIp: 0.0.0.0

sharding:
  clusterRole: configsvr

replication:
  replSetName: cfgReplSet
