version: '3.8'

services:
  # Master Node: Config Server
  configsvr:
    image: mongo:6.0
    container_name: mongo-configsvr
    command: ["mongod", "--configsvr", "--replSet", "cfgReplSet", "--port", "27019", "--bind_ip_all"]
    ports:
      - "27019:27019"
    volumes:
      - config-data:/data/configdb
    networks:
      - bds-cluster-net

  # Worker Node 1: Shard 1
  shard1:
    image: mongo:6.0
    container_name: mongo-shard1
    command: ["mongod", "--shardsvr", "--replSet", "shard1ReplSet", "--port", "27018", "--bind_ip_all"]
    ports:
      - "27018:27018"
    volumes:
      - shard1-data:/data/db
    networks:
      - bds-cluster-net

  # Worker Node 2: Shard 2
  shard2:
    image: mongo:6.0
    container_name: mongo-shard2
    command: ["mongod", "--shardsvr", "--replSet", "shard2ReplSet", "--port", "27028", "--bind_ip_all"]
    ports:
      - "27028:27028"
    volumes:
      - shard2-data:/data/db
    networks:
      - bds-cluster-net

  # Master Node: Mongo Router (mongos)
  mongos:
    image: mongo:6.0
    container_name: mongo-router
    depends_on:
      - configsvr
      - shard1
      - shard2
    command: ["mongos", "--configdb", "cfgReplSet/configsvr:27019", "--port", "27017", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - ../scripts:/scripts
    networks:
      - bds-cluster-net

networks:
  bds-cluster-net:
    driver: bridge

volumes:
  config-data:
  shard1-data:
  shard2-data:
