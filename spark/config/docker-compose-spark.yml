version: '3.8'

services:
  # Master Node: Spark Master
  spark-master:
    image: apache/spark:3.5.5
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8080:8080" # Spark Master Web UI
      - "7077:7077" # Spark Master Port
    volumes:
      - ../jobs:/opt/spark/jobs
      - ../../data:/opt/spark/data
    networks:
      - bds-cluster-net

  # Worker Node 1: Spark Worker 1
  spark-worker-1:
    image: apache/spark:3.5.5
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    ports:
      - "8081:8081" # Worker 1 Web UI
    volumes:
      - ../jobs:/opt/spark/jobs
      - ../../data:/opt/spark/data
    networks:
      - bds-cluster-net

  # Worker Node 2: Spark Worker 2
  spark-worker-2:
    image: apache/spark:3.5.5
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    ports:
      - "8082:8082" # Worker 2 Web UI
    volumes:
      - ../jobs:/opt/spark/jobs
      - ../../data:/opt/spark/data
    networks:
      - bds-cluster-net

networks:
  bds-cluster-net:
    name: bds-cluster-net
    driver: bridge
