# Apache Spark Default Configuration Properties
# Distributed Cyber Threat Intelligence Platform

# Master URL definition
spark.master                     spark://master:7077
spark.app.name                   CyberThreatAnalytics

# Memory & CPU allocations
spark.driver.memory              2g
spark.executor.memory            2g
spark.executor.cores             2

# Serialization & Networking
spark.serializer                 org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max  512m
spark.network.timeout            800s

# Event Logging & History
spark.eventLog.enabled           true
spark.eventLog.dir               hdfs://master:9000/spark-logs
spark.history.fs.logDirectory    hdfs://master:9000/spark-logs
spark.sql.shuffle.partitions     10

# UI configuration
spark.ui.enabled                 true
spark.ui.port                    4040

# MongoDB Connector settings
spark.mongodb.read.connection.uri   mongodb://master:27017/cicids2017.logs
spark.mongodb.write.connection.uri  mongodb://master:27017/cicids2017.logs
